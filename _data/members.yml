# Principal Investigator
pi:
  name_en: "Hyung-Tae Seo"
  name_ko: "서형태"
  title_en: "Assistant Professor · Principal Investigator"
  title_ko: "조교수 · 연구책임자"
  email: "htseo@kookmin.ac.kr"
  office: "Rm 709, Future Hall"
  phone: "+82 02-910-4703"
  scholar: "https://scholar.google.com/citations?user=NphqZNQAAAAJ&hl=ko"
  bio_en: "Hyung-Tae Seo is an Assistant Professor at Kookmin University and Principal Investigator of the ARC Lab. He previously served as an Assistant Professor at Kyonggi University (2023-2026) and as a staff researcher at the Samsung Advanced Institute of Technology (SAIT, 2020-2023). He received his B.S., M.S., and Ph.D. in Mechanical Engineering from KAIST. His research centers on robust control theory - disturbance observers and learning-based control - and its application to intelligent robotic systems."
  bio_ko: "서형태 교수는 국민대학교 조교수이자 ARC 연구실의 책임교수입니다. 이전에는 경기대학교 조교수(2023-2026)와 삼성종합기술원(SAIT) 전임연구원(2020-2023)을 역임했습니다. KAIST에서 기계공학 학사·석사·박사 학위를 받았으며, 외란 관측기와 학습 기반 제어를 중심으로 한 강인 제어 이론과 이를 지능형 로봇 시스템에 적용하는 연구를 수행합니다."
  education:
    - en: "Ph.D. in Mechanical Engineering, KAIST (2020)"
      ko: "KAIST 기계공학 박사 (2020)"
    - en: "M.S. in Mechanical Engineering, KAIST (2013)"
      ko: "KAIST 기계공학 석사 (2013)"
    - en: "B.S. in Mechanical Engineering, KAIST (2011)"
      ko: "KAIST 기계공학 학사 (2011)"

